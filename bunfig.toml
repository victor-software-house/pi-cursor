[install]
linker = "hoisted"
# BUN_CONFIG_TOKEN from the environment: `mise run release:oidc` in CI, operator npmjs token
# locally. Never add an .npmrc — bun honours it, and a scope line without a credential
# publishes unauthenticated.
registry = { url = "https://registry.npmjs.org", token = "$BUN_CONFIG_TOKEN" }

[install.scopes]
"@victor-software-house" = { url = "https://npm.pkg.github.com", token = "$PI_CURSOR_PACKAGES_TOKEN" }
